<!-- Q5: Write a JavaScript program to ask the user for their name and greet them with a message. -->

<html lang="en">
<head>
    <title>Greeting Message</title>
</head>
<body>
    <h1><center>Welcome</center></h1>
    <input type="text" id="nameInput" placeholder="Enter your name">
     <button onclick="check()">Submit</button>
     <p id="one"></p>
     <script>
        function check() {
           var name = document.getElementById("nameInput").value;
           document.getElementById("one").innerHTML = "Hello " + name + ", welcome to my website!";
        }
     </script>
</body>
</html>
