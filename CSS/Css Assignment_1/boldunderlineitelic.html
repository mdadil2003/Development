<!DOCTYPE html>
<html>
<head>
    <title>CSS Formatting</title>

    <style>
        .redText{
            color: greenyellow;
        }

        .boldText{
            font-weight: bold;
        }

        .underlineText{
            text-decoration: underline;
        }

        .italicText{
            font-style: italic;
        }

        p{
            background-color: rgb(145, 145, 62);
        }
    </style>

</head>
<body>
    <p>
        I am learning
        <span class="redText">HTML</span>,
        <span class="italicText">CSS</span> and
        <span class="boldText underlineText">JS</span>.
    </p>
</body>
</html>
