<html>
<head>
    <title>Timetable</title>

    <style>
        table{
            border-collapse: collapse;
            width: 70%;
        }

        th, td{
            border: 1px solid red;
            padding: 10px;
            text-align: center;
        }
    </style>

</head>
<body>

<h2>College Timetable</h2>

<table>

    <tr>
        <th>Day</th>
        <th>9:30am-11:30am</th>
        <th>11:30am-1pm</th>
        <th>2pm-4pm</th>
        <th>4pm-6pm</th>
    </tr>

    <tr>
        <td></td>
        <td colspan="2">Lab Session</td>
        <td colspan="2">Theory Session</td>
    </tr>

    <tr>
        <td>Monday</td>
        <td>Java Lab</td>
        <td>Web Lab</td>
        <td>Java Theory</td>
        <td>Web Theory</td>
    </tr>

    <tr>
        <td>Tuesday</td>
        <td colspan="2">DSA</td>
        <td colspan="2">Project Work</td>
    </tr>

</table>

</body>
</html>
