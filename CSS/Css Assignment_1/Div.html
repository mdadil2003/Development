<!DOCTYPE html>
<html>
<head>
    <title>Effect on Div</title>

    <style>

        .box{
            width: 300px;
            height: 200px;
            padding: 20px;
            background-color: lightblue;
            border: 2px solid black;
        }

        .box:hover{
            background-color: yellow;
        }

    </style>
</head>

<body>
    <div class="box">
        Welcome to CDAC WPT Module.
        Move the mouse over this div to change its color.
    </div>
</body>
</html>
