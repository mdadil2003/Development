<!DOCTYPE html>
<html>
<head>
    <title>Colored Table Header</title>

    <style>

        table{
            width: 80%;
            border-collapse: collapse;
        }

        th, td{
            padding: 15px;
            text-align: left;
        }

        th{
            background-color: yellow;
        }

        .gray{
            background-color: gray;
        }

    </style>

</head>
<body>

<h2>Colored Table Header</h2>

<table>

    <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Salary</th>
    </tr>

    <tr class="gray">
        <td>Mohan</td>
        <td>Sharma</td>
        <td>100</td>
    </tr>

    <tr>
        <td>Leena</td>
        <td>Goyal</td>
        <td>150</td>
    </tr>

    <tr class="gray">
        <td>Joe</td>
        <td>Singh</td>
        <td>300</td>
    </tr>

    <tr>
        <td>Chetna</td>
        <td>Sharma</td>
        <td>250</td>
    </tr>

</table>

</body>
</html>
