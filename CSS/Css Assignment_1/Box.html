<!DOCTYPE html>
<html>
<head>
    <title>Box</title>

    <style>

        .box{
            width: 300px;
            height: 200px;

            padding: 20px;
            border: 5px solid blue;
            margin: 30px;

            box-sizing: border-box;

            background-color: lightyellow;
        }

    </style>
</head>

<body>

    <div class="box">
        This is a div with fixed width and height,
        padding, border, margin and box-sizing.
    </div>

</body>
</html>
